<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tube Brain AI - YouTube Analytics Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #0F0F0F;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0F0F0F;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        .loading-logo { font-size: 64px; margin-bottom: 24px; animation: pulse 1.5s ease-in-out infinite; }
        .loading-title { font-size: 32px; font-weight: 800; color: #ffffff; margin-bottom: 8px; }
        .loading-subtitle { font-size: 14px; color: #9E9E9E; margin-bottom: 32px; }
        .loading-bar { width: 200px; height: 4px; background: #1A1A2E; border-radius: 2px; overflow: hidden; }
        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF0000, #FF6B35);
            border-radius: 2px;
            animation: loading 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes loading { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
        canvas { width: 100%; height: 100vh; }
    </style>
</head>
<body>
<div id="loading-screen">
    <div class="loading-logo">🧠</div>
    <div class="loading-title">Tube Brain AI</div>
    <div class="loading-subtitle">Powered by YouTube API v3 & Google Gemini</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<script src="downloader.js"></script>
<script src="composeApp.js"></script>
<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.classList.add('fade-out');
                setTimeout(function() { loadingScreen.style.display = 'none'; }, 500);
            }
        }, 1500);
    });
</script>
</body>
</html>
